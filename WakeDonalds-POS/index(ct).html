<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WakeDonald’s POS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>🍔 WakeDonald’s POS</h1>

<div id="pointsDisplay"></div>

<div class="meal">
  <h3>Big Wake Meal</h3>
  <button onclick="toggleFavorite('big-wake')">☆</button>
  <button onclick="addToCart('Big Wake Meal', 8)">Add $8</button>
</div>

<div class="meal">
  <h3>Wake Fries</h3>
  <button onclick="toggleFavorite('wake-fries')">☆</button>
  <button onclick="addToCart('Wake Fries', 3)">Add $3</button>
</div>

<br>

<button onclick="checkout()">Checkout</button>

<script src="js/app.js"></script>
<script src="js/points.js"></script>
<script src="js/orders.js"></script>
</body>
</html>
